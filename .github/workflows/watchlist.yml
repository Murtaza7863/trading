name: Refresh watchlist

on:
  schedule:
    # Weekdays around 9:45 / 12:00 / 15:30 US Eastern (EDT = UTC-4)
    - cron: "45 13 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy curl_cffi
      - name: Score board
        run: python run_watchlist.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/watchlist.json
          if git diff --staged --quiet; then
            echo "No board change"
          else
            git commit -m "Refresh watchlist snapshot"
            git push
          fi
